name: Python Package Compilation & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate_and_build:
    name: Test & Compile (.whl)
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down repository source code files onto the virtual machine runner
    - name: Checkout Repository Source
      uses: actions/checkout@v4

    # 2. Set up an isolated Python environment runtime context
    - name: Initialize Python 3.11 Environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Automatically caches downloaded dependencies to speed up future pipeline runs

    # 3. Upgrade local installer dependencies
    - name: Upgrade Base Packaging Prerequisites
      run: |
        python -m pip install --upgrade pip
        python -m pip install build

    # 4. Install your custom library along with its dependencies
    - name: Install Framework Core Requirements
      run: |
        pip install .
        # Pre-install numpy and pydantic since they are required by the test framework
        pip install numpy pydantic

    # 5. Execute your comprehensive unittest validation suite
    - name: Execute Core Test Suites
      run: |
        python -m unittest discover -s tests -p "test_*.py"

    # 6. Build the pure Python distribution wheels using PEP 517 build module
    - name: Compile Distribution Binaries (.whl & .tar.gz)
      run: |
        python -m build

    # 7. Extract the compiled wheel binaries out of the temporary VM runner 
    #    and bind them securely to your GitHub actions run dashboard.
    - name: Upload Compiled Wheel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: compiled-python-wheels
        path: dist/
        if-no-files-found: error
        retention-days: 14  # Retain the build files for two weeks before automatic recycling cleanups