[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-wrapper"
version = "0.1.0"
description = "An ultra-lightweight, zero-dependency hybrid local RAG framework optimized for consumer GPUs."
readme = "README.md"
authors = [
    { name = "Ashish Kumar" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.10"

# Add FastAPI and uvicorn for the optional API server
dependencies = [
    "ollama>=0.2.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "pylint>=2.17.0",
    "mypy>=1.0.0",
    "types-requests"
]

[tool.setuptools.packages.find]
where = ["src"]